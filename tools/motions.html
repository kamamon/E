<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>お手本の動きチェック（開発用）</title>
<style>
  body { margin: 0; background: #14112a; color: #fff; font: 11px sans-serif; }
  #root { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 18px; padding: 8px; justify-content: start; }
  .row { display: flex; gap: 3px; align-items: center; }
  .lab { width: 120px; line-height: 1.3; }
  .lab b { font-size: 12px; display: block; }
  canvas { background: #120f26; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { MOTIONS, rig, pAt, xAt, jointsAtRep, sideOf, dirOf } from '../js/motions.js';
import { drawFigure } from '../js/figure.js';
const q = new URLSearchParams(location.search);
let list = MOTIONS; if (q.get('ver')) list = list.filter(m => m.vers.includes(q.get('ver'))); if (q.get('keys')) { const k = q.get('keys').split(','); list = list.filter(m => k.includes(m.key)); }
const RF = [-0.6, -0.3, -0.1, 0, 0.3, 0.6, 1];
const W = 92, H = 118;
for (const m of list) {
  const R = rig(m, q.get('side') || 'R');
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<div class="lab"><b>${m.name}</b>${m.key}・${m.act}/${m.mode}<br>${R.n}回/周・${R.sides.join('')}${R.xs ? '・' + R.dirs.join('') : ''}</div>`;
  for (const rf of RF) {
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    const J = jointsAtRep(R, rf), p = pAt(R, rf), x = xAt(R, rf);
    drawFigure(g, J, { x: W / 2, y: H - 12, h: H * 0.78, view: m.view, sepW: 1.2 });
    g.fillStyle = rf === 0 || rf === 1 ? '#ffd23f' : '#9aa'; g.font = '10px sans-serif';
    g.fillText(`${rf} p${p.toFixed(2)}${x !== undefined ? ' x' + x.toFixed(1) : ''}`, 3, 11);
    if (Number.isInteger(rf)) g.fillText(sideOf(R, rf) + (R.xs ? dirOf(R, rf) : ''), W - 18, 11);
    row.append(c);
  }
  document.getElementById('root').append(row);
}
window.done = true;
</script>
</body>
</html>
